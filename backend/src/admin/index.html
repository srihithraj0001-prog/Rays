<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rays Admin Import</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;padding:16px}
      label{display:block;margin-top:8px}
      input,textarea,select{width:100%;padding:8px;margin-top:4px}
      .row{display:flex;gap:12px}
      .col{flex:1}
      .card{border:1px solid #ddd;padding:12px;border-radius:6px;margin-top:12px}
    </style>
  </head>
  <body>
    <h2>Rays — Admin Import</h2>
    <div class="card">
      <h3>Import PYQs (JSON or CSV)</h3>
      <form id="pyq-form">
        <label>Choose file (JSON/CSV): <input type="file" id="pyq-file" accept=".json,.csv" /></label>
        <button type="submit">Upload & Import</button>
      </form>
      <pre id="pyq-result"></pre>
    </div>

    <div class="card">
      <h3>Import PDF Manifest (JSON or CSV)</h3>
      <form id="pdf-manifest-form">
        <label>Choose file (JSON/CSV): <input type="file" id="pdf-manifest-file" accept=".json,.csv" /></label>
        <button type="submit">Upload Manifest</button>
      </form>
      <pre id="pdf-manifest-result"></pre>
    </div>

    <div class="card">
      <h3>Upload PDF File</h3>
      <form id="pdf-upload-form" enctype="multipart/form-data">
        <label>Choose PDF: <input type="file" id="pdf-file" accept="application/pdf" /></label>
        <label>Title: <input id="pdf-title" /></label>
        <label>Source: <input id="pdf-source" /></label>
        <label>Source URL: <input id="pdf-sourceUrl" /></label>
        <button type="submit">Upload PDF</button>
      </form>
      <pre id="pdf-upload-result"></pre>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
